name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restore Fixed Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
            echo "Fixed debug keystore successfully restored from debug.keystore.base64!"
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/PrivaDiary-latest.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivaDiary-APK
          path: release_apk/PrivaDiary-latest.apk
          retention-days: 30

      - name: Create GitHub Release for Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/PrivaDiary-latest.apk
          name: "PrivaDiary Release ${{ github.ref_name }}"
          body: |
            **PrivaDiary Release ${{ github.ref_name }}**

            - **File:** `PrivaDiary-latest.apk`
            - **Bảo mật:** Mã hóa E2EE, Mã PIN Vault
            - Tự động đóng gói từ GitHub Actions workflow.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Rolling Latest Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "PrivaDiary Latest Build"
          body: |
            **Bản dựng mới nhất (Latest Auto-Build)**

            - Tự động cập nhật mỗi khi push code lên nhánh chính (`main`/`master`).
            - Bao gồm mã hóa E2EE, Vault PIN, và đăng nhập duy trì session.
            - Tải file `PrivaDiary-latest.apk` bên dưới để cài đặt.
          files: release_apk/PrivaDiary-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

